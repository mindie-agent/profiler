name: profiler-ci
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/prof-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prof-venv
        run: uv venv --seed "${{ runner.temp }}/prof-venv"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/prof-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prof-venv
        run: uv pip install ".[test]"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/prof-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prof-venv
          MINDIE_CACHE_HOME: ${{ runner.temp }}/mindie-sim-cache
        run: uv run --no-project python -c "import pathlib, shutil; [shutil.rmtree(p, ignore_errors=True) for p in [*pathlib.Path('.').glob('*.egg-info'), pathlib.Path('build'), pathlib.Path('dist'), pathlib.Path('.venv')]]; import mindie_sim.prediction.runtime.accel_build as b; b.build_accel()"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/prof-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prof-venv
          MINDIE_CACHE_HOME: ${{ runner.temp }}/mindie-sim-cache
        run: uv run --no-project python -B -m pytest -q -n auto --dist worksteal -p no:cacheprovider -m "not live_npu" --basetemp="${{ runner.temp }}/pt" --durations=20 --junitxml="${{ runner.temp }}/results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiler-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/results.xml
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv build
      - run: |
          uv venv /tmp/profiler-wheel
          uv pip install --python /tmp/profiler-wheel/bin/python --no-deps dist/*.whl
          cd /tmp
          /tmp/profiler-wheel/bin/mindie-profiler --help

  release-ready:
    name: release-ready
    needs: [test, wheel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "required CI failed or was skipped"'
