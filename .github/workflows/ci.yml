name: profiler-ci
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: LF line endings & numeric literals
        run: |
          python3 .github/scripts/check_lf_eol.py
          python3 -B scripts/check_no_magic_numbers.py --root profiler=mindie_profiler --baseline scripts/magic_number_baseline.json --exceptions scripts/magic_number_exceptions.json
      - name: Classify PR diff scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/ci_scope.py detect \
            --event-name "$EVENT_NAME" \
            --base-sha "$PR_BASE_SHA" \
            --head-sha "$PR_HEAD_SHA"

  test:
    needs: [quality]
    if: needs.quality.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/prof-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prof-venv
        run: uv venv --seed "${{ runner.temp }}/prof-venv"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/prof-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prof-venv
        run: uv pip install ".[test]"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/prof-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prof-venv
        run: uv run --no-project python -c "import pathlib, shutil; [shutil.rmtree(p, ignore_errors=True) for p in [*pathlib.Path('.').glob('*.egg-info'), pathlib.Path('build'), pathlib.Path('dist'), pathlib.Path('.venv')]]"
      - env:
          VIRTUAL_ENV: ${{ runner.temp }}/prof-venv
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/prof-venv
        run: uv run --no-project python -B -m pytest -q -n auto --dist worksteal -p no:cacheprovider -m "not live_npu" --basetemp="${{ runner.temp }}/pt" --durations=20 --junitxml="${{ runner.temp }}/results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profiler-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/results.xml

  wheel:
    needs: [quality]
    if: needs.quality.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv build
      - run: |
          uv venv /tmp/profiler-wheel
          uv pip install --python /tmp/profiler-wheel/bin/python --no-deps dist/*.whl
          cd /tmp
          /tmp/profiler-wheel/bin/mindie-profiler --help

  release-ready:
    name: release-ready
    needs: [quality, test, wheel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_scope.py verify-needs --jobs quality test wheel
