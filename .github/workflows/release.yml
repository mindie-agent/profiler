name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@main
    secrets:
      MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
    with:
      release-notes-path: docs/releases/profiler-0.5.15.md
      python: /tmp/prof-rel-venv/bin/python
      setup-command: |
        uv venv --seed --python 3.13 /tmp/prof-rel-venv && uv pip install --python /tmp/prof-rel-venv/bin/python ".[test]" && /tmp/prof-rel-venv/bin/python -c "import mindie_sim.prediction.runtime.accel_build as b; b.build_accel()" && rm -rf build dist *.egg-info .venv
      test-command: |
        PYTHONDONTWRITEBYTECODE=1 /tmp/prof-rel-venv/bin/python -B -m pytest -q -n auto --dist worksteal -p no:cacheprovider -m "not live_npu"
