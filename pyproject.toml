[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-profiler"
version = "0.5.5"
description = "Ascend NPU profiling collection, in-place inventory/analyze/correlate/compare/sql analysis, and memory/online evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mindie-sim @ git+https://github.com/mindie-agent/sim.git@e404fb10477ca9ca5f8a143f569be99679e06c9e",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ijson>=3.2,<4", "psutil>=6,<8"]

[project.scripts]
mindie-profiler = "mindie_profiler.__main__:main"

[tool.setuptools.packages.find]
include = ["mindie_profiler*"]

[tool.pytest.ini_options]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]

[tool.setuptools.package-data]
mindie_profiler = ["knowledge/*.json"]
