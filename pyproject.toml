[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-profiler"
version = "0.5.15"
description = "Ascend NPU profiling collection, in-place inventory/analyze/correlate/compare/sql analysis, and memory/online evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mindie-sim @ https://github.com/mindie-agent/sim/archive/7474b5b1f0b38043a5af4694b7839de416f29a67.tar.gz",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-xdist>=3.5,<4", "ijson>=3.2,<4", "psutil>=6,<8"]

[project.scripts]
mindie-profiler = "mindie_profiler.__main__:main"
mindie-profiler-api = "mindie_profiler.public:main"

[tool.setuptools.packages.find]
include = ["mindie_profiler*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
    "archive_integration: opt-in host fleet archive; skipped unless selected or MINDIE_ARCHIVE_INTEGRATION=1",
]

[tool.setuptools.package-data]
mindie_profiler = ["knowledge/*.json", "_cann9_capture_shim.c", "_cann9_capture_mspti.h"]
