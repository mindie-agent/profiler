[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-profiler"
version = "0.5.11"
description = "Ascend NPU profiling collection, in-place inventory/analyze/correlate/compare/sql analysis, and memory/online evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mindie-sim @ git+https://github.com/mindie-agent/sim.git@f0f76b0b56830a0315c108efe90bcf131d3701ce",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ijson>=3.2,<4", "psutil>=6,<8"]

[project.scripts]
mindie-profiler = "mindie_profiler.__main__:main"

[tool.setuptools.packages.find]
include = ["mindie_profiler*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
    "archive_integration: opt-in host fleet archive; skipped unless selected or MINDIE_ARCHIVE_INTEGRATION=1",
]

[tool.setuptools.package-data]
mindie_profiler = ["knowledge/*.json"]
